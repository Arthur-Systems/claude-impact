services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: clearpath
      POSTGRES_PASSWORD: clearpath
      POSTGRES_DB: clearpath
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clearpath-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearpath"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  clearpath-pg:
