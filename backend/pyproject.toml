[project]
name = "clearpath-backend"
version = "0.1.0"
description = "ClearPath prototype platform and source-backed dataset storage"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.2",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.0.57",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [ "httpx2==2.16.0", "pytest==9.2.0", "ruff==0.17.4"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearpath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
