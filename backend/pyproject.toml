[project]
name = "clearpath"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic>=2", "pydantic-settings",
  "sqlalchemy>=2", "alembic", "psycopg[binary]>=3", "typer",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[project.scripts]
clearpath = "clearpath.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearpath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
